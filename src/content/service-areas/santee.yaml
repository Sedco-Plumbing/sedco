intro:
  - >-
    Most of Santee was built in waves — the 1970s and 1980s tracts of Carlton Hills, the newer streets of Sky
    Ranch, the growing developments near Santee Lakes. That history is convenient for a plumber, because when
    hundreds of houses go up within a few years of each other, their plumbing tends to wear out on the same
    clock. Sedco Plumbing has been working that clock from next-door El Cajon for years, serving every
    Santee neighborhood in ZIP code 92071, and we can usually tell you what’s failing on your street before
    we open the truck.

sections:
  - heading: Emergency Plumber in Santee, 24 Hours Mon–Sat
    paragraphs:
      - >-
        When a pipe bursts in Carlton Hills or a water heater lets go in Sky Ranch, you need a Santee plumber
        who can get there fast. Our phone is answered 24 hours a day, Monday to Saturday, and our trucks are a
        10–15 minute drive away via Highway 67 or Cuyamaca Street.
      - >-
        We respond to burst pipes, slab leaks, sewer backups, overflowing toilets and failed water heaters.
        While you wait, shut off the main water valve to protect your floors. If you smell gas, leave the home
        and call SDG&E or 911 first. We're closed on Sundays.

  - heading: Santee Plumbing Company for Homes That Age Together
    paragraphs:
      - >-
        Two patterns dominate our Santee calls. First, slab leaks: the tract homes here were built on concrete
        slabs with copper lines run underneath, and after four or five decades those lines develop pinholes. A
        warm patch of floor, a spinning water meter with everything off, or a mysterious jump in your water bill
        are the usual tells, and our electronic detection gear finds the leak without tearing up the house to
        look for it. Second, original-equipment water heaters — many Carlton Hills homes are on their first or
        second tank, and heaters past the ten-year mark fail in inconvenient ways. Replacing one on your
        schedule always beats replacing it during a garage flood.

